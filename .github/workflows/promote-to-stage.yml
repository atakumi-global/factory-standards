# Copy to <repo>/.github/workflows/promote-to-stage.yml
name: Promote to stage

on:
  workflow_dispatch:

jobs:
  promote:
    uses: atakumi-global/factory-ci/.github/workflows/promote.yml@v1
    with:
      source: dev
      target: stage
      environment: stage
    secrets:
      deploy_key: ${{ secrets.PROMOTE_DEPLOY_KEY }}   # repository secret (public repos); a private repo's
                                                      # environment secret reaches promote.yml by itself
    permissions:
      contents: write
      checks: read
      statuses: read
